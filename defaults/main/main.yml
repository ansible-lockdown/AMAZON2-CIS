## Section 3 Variables
# 3.1.x
# IPv6 required
amazon2cis_ipv6_required: false
amazon2cis_ipv6_sysctl_force: true
amazon2cis_ipv6_sysctl_file: /etc/sysctl.d/60-ipv6.conf
# Setting this will stop ipv6 listening on ::1 and will remove from /etc/hosts
amazon2cis_ipv6_disable_localhost: false

# service = true removes package - mask = true will just mask package
amazon2cis_bluetooth_service: true
amazon2cis_bluetooth_mask: false

# 3.3.x
# System network parameters (host only OR host and router)
amazon2cis_is_router: false
amazon2cis_ipv4_sysctl_file: /etc/sysctl.d/60-ipv4.conf

# Firewall Service
# The v4.0.0 benchmark covers firewalld only - the nftables and iptables controls were retired.
# The firewall to be configured
amazon2cis_system_firewall: firewalld
# Set the following to remove or mask - note will not effect system_firewall # set to none
amazon2cis_nftables: mask
amazon2cis_iptables: mask
amazon2cis_firewalld: none

# 4.1.3 - 4.1.6 the firewalld zone the system interfaces are assigned to
amazon2cis_active_firewall_zone: public

# 4.1.4 - target for the active zone, one of default, ACCEPT, DROP or REJECT
amazon2cis_firewalld_zone_target: DROP

# 4.1.8 - sets the default firewalld zone to drop, blocking all traffic that is not
# explicitly allowed. Left false by default - enable only once the services and ports
# required by the host (SSH included) are configured, or the host will become unreachable.
amazon2cis_firewalld_drop_all_traffic: false
##
## Section 4 Variables
##

# SSH variables

## Can be VERBOSE or INFO
amazon2cis_ssh_loglevel: INFO
# amazon2cis_ssh_maxsessions is the max number of sessions
# To conform to CIS standards this value needs to be 10 or less

amazon2cis_sshd_clientalivecountmax: 3
# clientaliveinterval should be between 1 and 900
amazon2cis_sshd_clientaliveinterval: 15
amazon2cis_sshd_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
amazon2cis_sshd_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
amazon2cis_sshd_kex: "curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256"
# logingracetime value is in seconds and needs to be set to 1 minute or less
amazon2cis_sshd_logingracetime: 60

# This variable, if specified, configures a list of USER name patterns, separated by spaces, to allow SSH
# access for users whose user name matches one of the patterns. This is done
# by setting the value of `AllowUsers` option in `/etc/ssh/sshd_config` file.
# If an USER@HOST format will be used, the specified user will be allowed only on that particular host.
amazon2cis_sshd_allowusers: "{% if ansible_facts['user_id'] != 'root' %}{{ ansible_facts['user_id'] }}{% elif ansible_facts['env']['SUDO_USER'] is defined %}{{ ansible_facts['env']['SUDO_USER'] }}{% endif %}"
## Control 5.2.4 - Ensure sshd access is configured
# (String) This variable, if specified, configures a list of GROUP name patterns, separated by spaces, to allow SSH access
# for users whose primary group or supplementary group list matches one of the patterns. This is done
# by setting the value of `AllowGroups` option in `/etc/ssh/sshd_config` file.
amazon2cis_sshd_allowgroups: ""
## Control 5.2.4 - Ensure sshd access is configured
# This variable, if specified, configures a list of USER name patterns, separated by spaces, to prevent SSH access
# for users whose user name matches one of the patterns. This is done
# by setting the value of `DenyUsers` option in `/etc/ssh/sshd_config` file.
# If an USER@HOST format will be used, the specified user will be restricted only on that particular host.
amazon2cis_sshd_denyusers: "nobody"
## Control 5.2.4 - Ensure sshd access is configured
# This variable, if specified, configures a list of GROUP name patterns, separated by spaces,
# to prevent SSH access for users whose primary group or supplementary group list matches one of the patterns. This is done
# by setting the value of `DenyGroups` option in `/etc/ssh/sshd_config` file.
amazon2cis_sshd_denygroups: ""

amazon2cis_ssh_maxsessions: 10
amazon2cis_ssh_maxauthtries: 4

## Optional settings not part of CIS but can assist systems
# Disable ipv6 on ssh if ipv6 not required
amazon2cis_ipv6_sshd_disable: false

## Sudo
amazon2cis_sudolog_location: "/var/log/sudo.log"
amazon2cis_sudo_timestamp_timeout: 15

# 5.3.4 sudoers NOPASSWD
# Accounts listed below will skip the NOPASSWD check and leave NOPASSWD set
amazon2cis_sudoers_exclude_nopasswd_list:
  - ec2-user
  - vagrant

# Group to be used for su
# this group needs to exists groups will not be created for remediation this is considered sys admins

amazon2cis_sugroup: wheel

# pam variables
amazon2cis_pam_faillock:
  deny: 5
  interval: 900
  unlock_time: 900
  fail_for_root: "no"
  remember: 5
  pwhash: sha512

amazon2cis_pwquality_difok: 2  # 2 or more required
amazon2cis_pwquality_maxrepeat: 3  # 3 or less not 0 required
amazon2cis_pwquality_minlen: 14  # 14 or more required
# Setting minclass true - mincalls used instead of separated values
amazon2cis_pwquality_minclass: true
amazon2cis_pwquality_minclass_value: '4'  # Not less than 4
amazon2cis_pwquality:
  - key: '#minclass'
    value: "{{ amazon2cis_pwquality_minclass_value }}"
  - key: 'dcredit'
    value: '-1'  # not 0 or greater
  - key: 'ucredit'
    value: '-1'  # not 0 or greater
  - key: 'ocredit'
    value: '-1'  # not 0 or greater
  - key: 'lcredit'
    value: '-1'  # not 0 or greater

# pwhistory
amazon2cis_pwhistory_remember: 24  # 24 or more recommended

## Users and environments
amazon2cis_encryption: sha512
# If encryption method changes foce users to change password at next login
amazon2cis_force_user_passwd_change: false
# Accounts listed below will not have INACTIVE field set in shadow file

# Allow dynamic discovery of user accounts minimum and maximum from /etc/login.defs
# findings will override the uid_min|max below
amazon2cis_uid_info_dynamic: true
amazon2cis_uid_min: 1000
amazon2cis_uid_max: 60000

## 5.5.1.1 Add users to be skipped if required
amazon2cis_user_skip_list:
  root

amazon2cis_pass_max_days: 365
amazon2cis_pass_min_days: 1
amazon2cis_pass_warn_age: 7
amazon2cis_pass_inactive: 30  # should not be 0 or -1 (little details in control)

# Session timeout setting file (TMOUT setting can be set in multiple files)
# Timeout value is in seconds. (60 seconds * 10 = 600)
amazon2cis_shell_session_timeout:
  file: /etc/profile.d/tmout.sh
  timeout: 600

amazon2cis_root_umask: '0027'  # 0027 or more restrictive

##
## Section 5 Variables
##

# Preferred method of logging
# Whether rsyslog or journald preferred method for local logging
amazon2cis_syslog: rsyslog
amazon2cis_rsyslog_ansiblemanaged: true
# Set if system is the log server
amazon2cis_system_is_log_server: false

# remote and destination log server name
amazon2cis_remote_log_server: false
amazon2cis_remote_log_host: logagg.example.com
amazon2cis_remote_log_port: 514
amazon2cis_remote_log_protocol: tcp
amazon2cis_remote_log_retrycount: 100
amazon2cis_remote_log_queuesize: 1000

# Journald

amazon2cis_journald_systemmaxuse: 10M
amazon2cis_journald_systemkeepfree: 100G
amazon2cis_journald_runtimemaxuse: 10M
amazon2cis_journald_runtimekeepfree: 100G
amazon2cis_journald_maxfilesec: 1month

# 6.2.3.6 exclude listed mountpoints from the find command to locate privileged binaries
# Allows operator to exclude mounted devices from being considered as within scope to find privileged binaries; mainly in the case of
# external/temporary mounted USB drives.
#   amazon2cis_priv_command_excluded_mounts: ["/mnt/backup_disk", "/mnt/usb_external_storage"]
amazon2cis_priv_command_excluded_mounts: []

# amazon2cis_logrotate sets the daily, weekly, monthly, yearly value for the log rotation
# To conform to CIS standards this just needs to comply with your site policy
amazon2cis_logrotate: "daily"

# AuditD
# The audit_back_log_limit value should never be below 8192
amazon2cis_audit_back_log_limit: 8192
# The max_log_file parameter should be based on your sites policy size in MB
amazon2cis_max_log_file_size: 10

# auditd settings
amazon2cis_auditd_disk_error_action: halt
amazon2cis_auditd_disk_full_action: halt
amazon2cis_auditd_space_left_action: email
amazon2cis_auditd_admin_space_left_action: single
amazon2cis_auditd_max_log_file_action: keep_logs

# This can be used to configure other keys in auditd.conf
amazon2cis_auditd_extra_conf: {}
# Example:
# amazon2cis_auditd_extra_conf:
#     admin_space_left: '10%'

# AIDE
# aide setup via - cron, timer
amazon2cis_aide_scan: cron
amazon2cis_config_aide: true
# AIDE cron settings
amazon2cis_aide_cron_user: root
amazon2cis_aide_cron_file: /etc/cron.d/cis_aide
amazon2cis_aide_cron_job: '/usr/sbin/aide --check'
amazon2cis_aide_cron_minute: 0
amazon2cis_aide_cron_hour: 5
amazon2cis_aide_cron_day: '*'
amazon2cis_aide_cron_month: '*'
amazon2cis_aide_cron_weekday: '*'

##
## Section 6 variables
##

#

# Allow ansible to adjust world-writable files. False will just display world-writable files, True will remove world-writable
amazon2cis_no_world_write_adjust: true

## Control 7.1.12 - Ensure no unowned or ungrouped files or directories exist
# This variable is a toggle for enabling/disabling the automated
# setting of an owner (specified in variable `amazon2cis_unowned_owner`)
# for all unowned files and directories.
# Possible values are `true` and `false`.
amazon2cis_ownership_adjust: true
# This variable holds the part of the command that helps detect which files and
# directories do not have an owner and an affiliated group.
amazon2cis_exclude_unowned_search_path: (! -path "/run/user/*" -a ! -path "/proc/*" -a ! -path "*/containerd/*" -a ! -path "*/kubelet/pods/*" -a ! -path "*/kubelet/plugins/*" -a ! -path "/sys/fs/cgroup/memory/*" -a ! -path "/var/*/private/*")
# The value of this variable specifies the owner that will be set for unowned files and directories.
amazon2cis_unowned_owner: root
# The value of this variable specifies the group that will be set for ungrouped files and directories.
amazon2cis_ungrouped_group: root
## Remove suid/sgid from files
amazon2cis_suid_adjust: false
amazon2cis_sgid_adjust: false

# 6.2.12
amazon2cis_dotperm_ansiblemanaged: true
