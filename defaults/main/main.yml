## Section 1 variables

# 1.1.1.7 - filesystem kernel modules the benchmark reviews as unused.
# Loaded modules in this list raise a warning; unloading a filesystem in use may be FATAL,
# so remediation is deliberately left as a manual task.
amazon2cis_unused_filesystem_modules:
  - afs
  - ceph
  - cifs
  - exfat
  - fat
  - fscache
  - fuse
  - gfs2
  - nfs_common
  - nfsd
  - smbfs_common

## Ability to enable debug on mounts to assist in troubleshooting
# Mount point changes are set based upon facts created in Prelim
# these then build the variable and options that is passed to the handler to set the
# mount point for the controls in section1.
amazon2cis_debug_mount_data: false

# How /tmp mount options are managed:
#  - true:  use the tmp.mount systemd unit
#  - false: use /etc/fstab
#  - auto:  discover it - a tmp.mount unit if /tmp is mounted by one, otherwise /etc/fstab
# Either way /tmp must already be a separate mount; 1.1.2.1.1 only warns when it is not.
# These /tmp settings will include nosuid,nodev,noexec to conform to CIS standards.
amazon2cis_tmp_svc: true

# cis 1.5.8
kernel_sysctl_file: /etc/sysctl.d/60-kernel_sysctl.conf
# 1.5.2 - 1.5.4 filesystem sysctl settings
amazon2cis_fs_sysctl_file: /etc/sysctl.d/60-fs_sysctl.conf

# Warning Banner Content (issue, issue.net, motd)
amazon2cis_warning_banner: |
    Authorized uses only. All activity may be monitored and reported.
# End Banner

## Section 2 variables
amazon2cis_time_synchronization: chrony
amazon2cis_time_synchronization_servers:
