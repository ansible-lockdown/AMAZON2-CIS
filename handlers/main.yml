---

- name: "Remount tmp filesystem"
  ansible.builtin.include_tasks:
    file: remount_tmp.yml
  listen: "Remount /tmp"

# Mount option handlers are paired: the first writes the accumulated option
# set from prelim_mount_point_fs_and_options back to fstab, the second
# applies it. Remounting alone would only re-read an unchanged fstab entry.
- name: Adding options for /dev/shm
  vars:
    mount_point: /dev/shm
  ansible.posix.mount:
    path: '{{ mount_point }}'
    src: "{{ prelim_mount_point_fs_and_options[mount_point]['src'] }}"
    state: present
    fstype: "{{ prelim_mount_point_fs_and_options[mount_point]['fs_type'] }}"
    opts: "{{ prelim_mount_point_fs_and_options[mount_point]['options'] | unique | join(',') }}"
  listen: Remount /dev/shm

- name: Remounting /dev/shm
  vars:
    mount_point: /dev/shm
  ansible.posix.mount:
    path: '{{ mount_point }}'
    state: remounted
  listen: Remount /dev/shm

