- name: Systemd_daemon_reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: Rebuild_grub
  ansible.builtin.command: /sbin/grub2-mkconfig -o "{{ amazon2cis_bootloader_file }}"
  changed_when: true

- name: Restart_postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Sysctl_flush_ipv4_routes
  ansible.posix.sysctl:
    name: net.ipv4.route.flush
    value: '1'
    sysctl_set: true
  ignore_errors: true # noqa ignore-errors

- name: Sysctl_flush_ipv6_routes
  ansible.posix.sysctl:
    name: net.ipv6.route.flush
    value: '1'
    sysctl_set: true
  ignore_errors: true # noqa ignore-errors

- name: Restart_rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Restart_journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Restart_systemd_journal_upload
  ansible.builtin.service:
    name: systemd-journal-upload
    state: restarted

- name: Audit_immutable_fact
  when: discovered_auditd_immutable_check.rc == 0
  ansible.builtin.debug:
    msg: "Reboot required for auditd to apply new rules as immutable set"
  notify: Change_requires_reboot

- name: Restart_auditd # noqa: command-instead-of-module
  ansible.builtin.command: /sbin/service auditd restart
  changed_when: true

- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Restart_chronyd
  ansible.builtin.service:
    name: chronyd
    state: restarted

- name: Change_requires_reboot
  ansible.builtin.set_fact:
    change_requires_reboot: true
