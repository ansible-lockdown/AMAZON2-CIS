---

- name: "SECTION | 3.1.x | Disable unused network protocols and devices"
  ansible.builtin.import_tasks:
    file: cis_3.1.x.yml

- name: "SECTION | 3.2.x | Network Kernel modules (Host Only)"
  ansible.builtin.import_tasks:
    file: cis_3.2.x.yml

- name: "SECTION | 3.3.1.x | Network Kernel Parameters IPv4"
  ansible.builtin.import_tasks:
    file: cis_3.3.1.x.yml

- name: "SECTION | 3.3.2.x | Network Kernel Parameters IPv6"
  when: amazon2cis_ipv6_required or amazon2cis_ipv6_sysctl_force
  ansible.builtin.import_tasks:
    file: cis_3.3.2.x.yml
