---

- name: "3.2.1 | PATCH | Ensure can kernel module is not available"
  when: amazon2cis_rule_3_2_1
  tags:
    - level1-server
    - automated
    - patch
    - can
    - NIST800-53R5_CM-7
    - NIST800-53R5_SI-4
    - rule_3.2.1
  block:
    - name: "3.2.1 | PATCH | Ensure can kernel module is not available | CIS"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install can(\\s|$)"
        line: "install can /bin/true"
        create: true
        mode: 'u-x,go-rwx'

    - name: "3.2.1 | PATCH | Ensure can kernel module is not available | blacklist"
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist.conf
        regexp: "^(#)?blacklist can(\\s|$)"
        line: "blacklist can"
        create: true
        mode: 'u-x,go-rwx'

