---

- name: "3.3.2.1 | PATCH | Ensure net.ipv6.conf.all.forwarding is configured"
  when:
    - not amazon2cis_is_router
    - amazon2cis_rule_3_3_2_1
  tags:
    - level1-server
    - automated
    - patch
    - sysctl
    - rule_3.3.2.1
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '0'
    state: present
    reload: true
    sysctl_set: true
    ignoreerrors: true
    sysctl_file: "{{ amazon2cis_ipv6_sysctl_file }}"
  notify: Sysctl_flush_ipv6_routes

