---

- name: "5.5.2.1 | PATCH | Ensure root is the only UID 0 account"
  when: amazon2cis_rule_5_5_2_1
  tags:
    - level1-server
    - patch
    - accounts
    - users
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.5.2.1
  block:

    - name: "5.5.2.1 | AUDIT | Ensure root is the only UID 0 account"
      ansible.builtin.shell: |
        set -o pipefail
        cat /etc/passwd | awk -F: '($3 == 0 && $1 != "root") {i++;print $1 } END {exit i}'
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      check_mode: false
      register: discovered_uid_zero_accounts_except_root

    - name: "5.5.2.1 | PATCH | Ensure root is the only UID 0 account"
      ansible.builtin.command: passwd -l {{ item }}
      changed_when: false
      failed_when: false
      loop: "{{ discovered_uid_zero_accounts_except_root.stdout_lines }}"

- name: "5.5.2.2 | PATCH | Ensure root is the only GID 0 account"
  when:
    - amazon2cis_rule_5_5_2_2
    - amazon2cis_disruption_high
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.5.2.2
    - user
    - system
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  block:
    - name: "5.5.2.2 | AUDIT | Ensure root is the only GID 0 account | Get members of gid 0"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $4=="0") {print $1}' /etc/passwd | grep -wv 'root'
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_gid0_members.rc not in [ 0, 1 ]
      register: discovered_gid0_members

    - name: "5.5.2.2 | PATCH | Ensure root is the only GID 0 account | Remove users not root from gid 0"
      when:
        - discovered_gid0_members is defined
        - discovered_gid0_members.stdout | length > 0
      ansible.builtin.user:
        name: "{{ item }}"
        group: root
        state: absent
      loop: "{{ discovered_gid0_members.stdout_lines }}"

- name: "5.5.2.3 | AUDIT | Ensure group root is the only GID 0 group"
  when: amazon2cis_rule_5_5_2_3
  tags:
    - level1-server
    - automated
    - audit
    - rule_5.5.2.3
    - user
    - system
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  block:
    - name: "5.5.2.3 | AUDIT | Ensure group root is the only GID 0 group | Get groups with gid 0"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '$3=="0"{print $1}' /etc/group | grep -vw 'root'
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_gid0_groups.rc not in [ 0, 1 ]
      register: discovered_gid0_groups

    - name: "5.5.2.3 | AUDIT | Ensure group root is the only GID 0 group | Warning if other gid 0 groups"
      when:
        - discovered_gid0_groups is defined
        - discovered_gid0_groups.stdout | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have other groups assigned to GID 0 - Please resolve"
          - "{{ discovered_gid0_groups.stdout_lines }}"

    - name: "5.5.2.3 | AUDIT | Ensure group root is the only GID 0 group | Capture Warning"
      when:
        - discovered_gid0_groups is defined
        - discovered_gid0_groups.stdout | length > 0
      vars:
        warn_control_id: '5.5.2.3'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "5.5.2.4 | PATCH | Ensure root account access is controlled"
  when: amazon2cis_rule_5_5_2_4
  tags:
    - level1-server
    - automated
    - patch
    - shadow_suite
    - rule_5.5.2.4
  ansible.builtin.debug:
    msg: "This is set as an assert in tasks/main"

- name: "5.5.2.5 | PATCH | Ensure root path integrity"
  when: amazon2cis_rule_5_5_2_5
  tags:
    - level1-server
    - patch
    - paths
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_5.5.2.5
  block:
    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Get root paths"
      ansible.builtin.shell: |
        set -o pipefail
        sudo -Hiu root env | grep '^PATH' | cut -d= -f2
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      register: discovered_root_paths

    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Get root paths"
      ansible.builtin.shell: |
        set -o pipefail
        sudo -Hiu root env | grep '^PATH' | cut -d= -f2 | tr ":" "\n"
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      register: discovered_root_paths_split

    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Set fact"
      ansible.builtin.set_fact:
        root_paths: "{{ discovered_root_paths.stdout }}"

    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Check for empty dirs"
      ansible.builtin.shell: |
        set -o pipefail
        echo {{ root_paths }} | grep -q "::" && echo "roots path contains a empty directory (::)"
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_root_path_empty_dir.rc not in [ 0, 1 ]
      register: discovered_root_path_empty_dir

    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Check for trailing ':'"
      ansible.builtin.shell: |
        set -o pipefail
        {{ root_paths }} | cut -d= -f2 | grep -q ":$" && echo "roots path contains a trailing (:)"
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_root_path_trailing_colon.rc not in [ 0, 1 ]
      register: discovered_root_path_trailing_colon

    - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Check for owner and permissions"
      block:
        - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Check for owner and permissions"
          ansible.builtin.stat:
            path: "{{ item }}"
          register: discovered_root_path_perms
          loop: "{{ discovered_root_paths_split.stdout_lines }}"

        - name: "5.5.2.5 | AUDIT | Ensure root PATH Integrity | Set permissions"
          when:
            - item.stat.exists
            - item.stat.isdir
            - item.stat.pw_name != 'root' or item.stat.gr_name != 'root' or item.stat.woth or item.stat.wgrp
            - (item != 'root') and (not amazon2cis_uses_root)
          ansible.builtin.file:
            path: "{{ item.stat.path }}"
            state: directory
            owner: root
            group: root
            mode: 'go-w'
            follow: false
          loop: "{{ discovered_root_path_perms.results }}"
          loop_control:
            label: "{{ item }}"

- name: "5.5.2.6 | PATCH | Ensure root user umask is configured"
  when: amazon2cis_rule_5_5_2_6
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - shadow_suite
    - rule_5.5.2.6
  ansible.builtin.lineinfile:
    path: /root/.bash_profile
    regexp: \s*umask
    line: "umask {{ amazon2cis_root_umask }}"

- name: "5.5.2.7 | PATCH | Ensure system accounts do not have a valid login shell"
  when: amazon2cis_rule_5_5_2_7
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-11
    - NIST800-53R5_MP-2
    - shadow_suite
    - rule_5.5.2.7
  block:
    - name: "5.5.2.7 | PATCH | Ensure system accounts do not have a valid login shell | Set nologin"
      when:
        - item.id != "root"
        - item.id != "sync"
        - item.id != "shutdown"
        - item.id != "halt"
        - item.id != "nfsnobody"
        - item.uid < amazon2cis_uid_min | int
        - item.shell != "      /bin/false"
        - item.shell != "      /usr/sbin/nologin"
      ansible.builtin.user:
        name: "{{ item.id }}"
        shell: /usr/sbin/nologin
      loop: "{{ prelim_captured_passwd_data }}"
      loop_control:
        label: "{{ item.id }}"

    - name: "5.5.2.7 | PATCH | Ensure system accounts do not have a valid login shell | Lock accounts"
      when:
        - item.id != "root"
        - item.id != "sync"
        - item.id != "shutdown"
        - item.id != "halt"
        - item.id != "nfsnobody"
        - item.uid < amazon2cis_uid_min | int
        - item.shell != "      /bin/false"
        - item.shell != "      /usr/sbin/nologin"
      ansible.builtin.user:
        name: "{{ item.id }}"
        password_lock: true
      loop: "{{ prelim_captured_passwd_data }}"
      loop_control:
        label: "{{ item.id }}"

- name: "5.5.2.8 | PATCH | Ensure accounts without a valid login shell are locked"
  when:
    - amazon2cis_rule_5_5_2_8
    - amazon2cis_disruption_high
    - item.id != 'root'
    - item.id not in amazon2cis_user_skip_list
    - item.shell is search('nologin') or item.shell == '/bin/false'
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.5.2.8
    - user
    - system
    - NIST800-53R5_AC-2
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.user:
    name: "{{ item.id }}"
    password_lock: true
  loop: "{{ prelim_captured_passwd_data }}"
