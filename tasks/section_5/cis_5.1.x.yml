---

- name: "5.1.1.1 | PATCH | Ensure cron daemon is enabled and active"
  when: amazon2cis_rule_5_1_1_1
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.1
    - cron
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
  ansible.builtin.service:
    name: crond
    state: started
    enabled: true

- name: "5.1.1.2 | PATCH | Ensure access to /etc/crontab is configured"
  when: amazon2cis_rule_5_1_1_2
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.2
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/crontab
    owner: root
    group: root
    mode: 'u-x,go-rwx'

- name: "5.1.1.3 | PATCH | Ensure access to /etc/cron.hourly is configured"
  when: amazon2cis_rule_5_1_1_3
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.3
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/cron.hourly
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-rwx'

- name: "5.1.1.4 | PATCH | Ensure access to /etc/cron.daily is configured"
  when: amazon2cis_rule_5_1_1_4
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.4
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/cron.daily
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-rwx'

- name: "5.1.1.5 | PATCH | Ensure access to /etc/cron.weekly is configured"
  when: amazon2cis_rule_5_1_1_5
  tags:
    - level1-server
    - patch
    - rule_5.1.1.5
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/cron.weekly
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-rwx'

- name: "5.1.1.6 | PATCH | Ensure access to /etc/cron.monthly is configured"
  when: amazon2cis_rule_5_1_1_6
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.6
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/cron.monthly
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-rwx'

- name: "5.1.1.7 | PATCH | Ensure access to /etc/cron.d is configured"
  when: amazon2cis_rule_5_1_1_7
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.7
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  ansible.builtin.file:
    dest: /etc/cron.d
    state: directory
    owner: root
    group: root
    mode: 'u+x,go-rwx'

- name: "5.1.1.8 | PATCH | Ensure access to crontab is configured"
  when: amazon2cis_rule_5_1_1_8
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.1.8
    - permissions
    - cron
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.1.8 | PATCH | Ensure access to crontab is configured | Remove cron.deny"
      ansible.builtin.file:
        dest: /etc/cron.deny
        state: absent

    - name: "5.1.1.8 | PATCH | Ensure access to crontab is configured | Check if cron.allow exists"
      ansible.builtin.stat:
        path: "/etc/cron.allow"
      register: discovered_cron_allow_status

    - name: "5.1.1.8 | PATCH | Ensure access to crontab is configured | Ensure cron.allow is restricted to authorized users"
      ansible.builtin.file:
        dest: /etc/cron.allow
        state: '{{ "file" if discovered_cron_allow_status.stat.exists else "touch" }}'
        owner: root
        group: root
        mode: 'u-x,go-rwx'

- name: "5.1.2.1 | PATCH | Ensure access to at is configured"
  when: amazon2cis_rule_5_1_2_1
  tags:
    - level1-server
    - automated
    - patch
    - rule_5.1.2.1
    - at
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
  block:
    - name: "5.1.2.1 | PATCH | Ensure access to at is configured | Remove at.deny"
      ansible.builtin.file:
        dest: /etc/at.deny
        state: absent

    - name: "5.1.2.1 | AUDIT | Ensure access to at is configured | Check if at.allow exists"
      ansible.builtin.stat:
        path: "/etc/at.allow"
      register: discovered_at_allow_status

    - name: "5.1.2.1 | PATCH | Ensure access to at is configured | Ensure at.allow is restricted to authorized users"
      ansible.builtin.file:
        dest: /etc/at.allow
        state: '{{ "file" if discovered_at_allow_status.stat.exists else "touch" }}'
        owner: root
        group: root
        mode: 'u-x,go-rwx'
