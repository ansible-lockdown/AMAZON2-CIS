---

- name: "6.1.2.1 | PATCH | Ensure rsyslog is installed"
  when:
    - "'rsyslog' not in ansible_facts['packages']"
    - amazon2cis_rule_6_1_2_1
  tags:
    - level1-server
    - patch
    - rsyslog
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_SI-5
    - rule_6.1.2.1
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: "6.1.2.2 | PATCH | Ensure rsyslog service is enabled and active"
  when: amazon2cis_rule_6_1_2_2
  tags:
    - level1-server
    - patch
    - rsyslog
    - NIST800-53R5_AU-3
    - NIST800-53R5_AU-12
    - rule_6.1.2.2
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true

- name: "6.1.2.3 | PATCH | Ensure rsyslog log file creation mode is configured"
  when: amazon2cis_rule_6_1_2_3
  tags:
    - level1-server
    - patch
    - rsyslog
    - rule_6.1.2.3
  notify: Restart_rsyslog
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode'
    line: '$FileCreateMode 0640'

- name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured"
  when: amazon2cis_rule_6_1_2_4
  tags:
    - level1-server
    - patch
    - rsyslog
    - rule_6.1.2.4
  notify: Restart_rsyslog
  block:
    - name: "6.1.2.4 | AUDIT | Ensure rsyslog logging is configured | rsyslog current config message out"
      ansible.builtin.command: cat /etc/rsyslog.conf
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_rsyslog_audit

    - name: "6.1.2.4 | AUDIT | Ensure rsyslog logging is configured | rsyslog current config message out"
      ansible.builtin.debug:
        msg:
          - "These are the current logging configurations for rsyslog, please review:"
          - "{{ discovered_rsyslog_audit.stdout_lines }}"

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | mail.* log setting"
      when: amazon2cis_rsyslog_ansiblemanaged
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        marker: "# {mark} MAIL LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # mail logging additions to meet CIS standards
          mail.*                                                  -/var/log/mail
          mail.info                                               -/var/log/mail.info
          mail.warning                                            -/var/log/mail.warning
          mail.err                                                /var/log/mail.err
        insertafter: '# Log all the mail messages in one place.'

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Misc. log setting"
      when: amazon2cis_rsyslog_ansiblemanaged
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "# {mark} MISC. LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # misc. logging additions to meet CIS standards
          *.=warning;*.=err                                        -/var/log/warn
          *.crit                                                   /var/log/warn
          *.*;mail.none;news.none                                  /var/log/messages
        insertafter: '#### RULES ####'

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Local log settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} LOCAL LOG SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # local log settings to meet CIS standards
          local0,local1.*                                          -/var/log/localmessages
          local2,local3.*                                          -/var/log/localmessages
          local4,local5.*                                          -/var/log/localmessages
          local6,local7.*                                          -/var/log/localmessages
          *.emerg                                                    :omusrmsg:*
        insertafter: '#### RULES ####'

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Auth Settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} Auth SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # Private settings to meet CIS standards
          auth,authpriv.*                                           /var/log/secure
        insertafter: '#### RULES ####'

    - name: "6.1.2.4 | PATCH | Ensure rsyslog logging is configured | Cron Settings"
      ansible.builtin.blockinfile:
        path: /etc/rsyslog.conf
        state: present
        marker: "#{mark} Cron SETTINGS - CIS benchmark - Ansible-lockdown"
        block: |
          # Cron settings to meet CIS standards
          cron.*                                                   /var/log/cron
        insertafter: '#### RULES ####'

- name: "6.1.2.5 | PATCH | Ensure rsyslog is configured to send logs to a remote log host"
  when:
    - amazon2cis_rule_6_1_2_5
    - amazon2cis_remote_log_server
  tags:
    - level1-server
    - patch
    - rsyslog
    - rule_6.1.2.5
  notify: Restart_rsyslog
  ansible.builtin.blockinfile:
    path: /etc/rsyslog.conf
    state: present
    block: |
      # target can be IP or FQDN
      *.* action(type="omfwd" target="{{ amazon2cis_remote_log_host }}" port="{{ amazon2cis_remote_log_port }}" protocol="{{ amazon2cis_remote_log_protocol }}" action.resumeRetryCount="{{ amazon2cis_remote_log_retrycount }}" queue.type="LinkedList" queue.size="{{ amazon2cis_remote_log_queuesize }}")
    insertafter: EOF
  failed_when:
    - discovered_rsyslog_remote_log_host is failed
    - discovered_rsyslog_remote_log_host.rc != 257
  register: discovered_rsyslog_remote_log_host

- name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client"
  when: amazon2cis_rule_6_1_2_6
  tags:
    - level1-server
    - patch
    - rsyslog
    - rule_6.1.2.6
  notify: Restart_rsyslog
  block:
    - name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When not log host"
      when: not amazon2cis_system_is_log_server
      ansible.builtin.replace:
        path: /etc/rsyslog.conf
        regexp: '{{ item }}'
        replace: '#\1'
      loop:
        - '^(\$ModLoad imtcp)'
        - '^(\$InputTCPServerRun)'
        - '^(module\(load="imtcp"\))'
        - '^(input\(type="imtcp")'

    - name: "6.1.2.6 | PATCH | Ensure rsyslog is not configured to receive logs from a remote client | When log host"
      when: amazon2cis_system_is_log_server
      ansible.builtin.replace:
        path: /etc/rsyslog.conf
        regexp: '^#(.*{{ item }}.*)'
        replace: '\1'
      loop:
        - 'ModLoad imtcp'
        - 'InputTCPServerRun'

- name: "6.1.2.7 | PATCH | Ensure logrotate is configured"
  when: amazon2cis_rule_6_1_2_7
  tags:
    - level1-server
    - manual
    - patch
    - logrotate
    - rule_6.1.2.7
  block:
    - name: "6.1.2.7 | AUDIT | Ensure logrotate is configured | Get logrotate settings"
      ansible.builtin.find:
        paths: /etc/logrotate.d/
      register: discovered_log_rotate_conf

    - name: "6.1.2.7 | PATCH | Ensure logrotate is configured | conf files"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ amazon2cis_logrotate }}"
      loop: "{{ discovered_log_rotate_conf.files }}"

    - name: "6.1.2.7 | PATCH | Ensure logrotate is configured | logrotate.conf"
      ansible.builtin.replace:
        path: /etc/logrotate.conf
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ amazon2cis_logrotate }}"
