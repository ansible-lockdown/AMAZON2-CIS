---

- name: "6.1.1.1 | PATCH | Ensure journald service is active"
  when:
    - amazon2cis_rule_6_1_1_1
    - amazon2cis_syslog == 'journald'
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - rule_6.1.1.1
  block:
    - name: "6.1.1.1 | PATCH | Ensure journald service is active | Enable service"
      ansible.builtin.systemd:
        name: systemd-journald
        state: started
        enabled: true

    - name: "6.1.1.1 | AUDIT | Ensure journald service is active | Capture status"  # noqa: command-instead-of-module
      ansible.builtin.command: systemctl is-enabled systemd-journald.service
      changed_when: false
      failed_when: false
      register: discovered_journald_status

    - name: "6.1.1.1 | AUDIT | Ensure journald service is active | Alert on bad status"
      when: "'static' not in discovered_journald_status.stdout"
      ansible.builtin.debug:
        msg:
          - "Warning!! The status of systemd-journald should be static and it is not. Please investigate"

- name: "6.1.1.2 | PATCH | Ensure systemd-journal-remote service is not in use"
  when:
    - not amazon2cis_system_is_log_server
    - amazon2cis_rule_6_1_1_2
    - amazon2cis_syslog == 'journald'
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - rule_6.1.1.2
  notify: Systemd_daemon_reload
  ansible.builtin.systemd:
    name: systemd-journal-remote.socket
    enabled: "{{ ('systemd-journal-remote' in ansible_facts['packages']) | ternary(false, omit) }}"
    state: "{{ ('systemd-journal-remote' in ansible_facts['packages']) | ternary('stopped', omit) }}"
    masked: true

- name: "6.1.1.3 | PATCH | Ensure journald Compress is configured"
  when: amazon2cis_rule_6_1_1_3
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - rule_6.1.1.3
  notify: Restart_journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: 'Compress='
    line: Compress=yes
    insertafter: ^#Compress
    validate: /usr/bin/bash -n %s

- name: "6.1.1.4 | PATCH | Ensure journald Storage is configured"
  when: amazon2cis_rule_6_1_1_4
  tags:
    - level1-server
    - automated
    - patch
    - journald
    - rule_6.1.1.4
  notify: Restart_journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: 'Storage='
    line: Storage=persistent
    state: present
    insertafter: ^#Storage
    validate: /usr/bin/bash -n %s

# This is counter to control 5.1.1.3??

- name: "6.1.1.5 | PATCH | Ensure journald ForwardToSyslog is configured"
  when:
    - amazon2cis_rule_6_1_1_5
    - amazon2cis_syslog == 'journald'
  tags:
    - level1-server
    - manual
    - patch
    - journald
    - rule_6.1.1.5
  notify: Restart_journald
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^ForwardToSyslog="
    line: "#ForwardToSyslog=yes"

- name: "6.1.1.6 | PATCH | Ensure journald log file rotation is configured"
  when:
    - amazon2cis_rule_6_1_1_6
    - amazon2cis_syslog == 'journald'
  tags:
    - level1-server
    - manual
    - patch
    - journald
    - rule_6.1.1.6
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  notify: Restart_journald
  loop:
    - { regexp: '^#SystemMaxUse=|^SystemMaxUse=', line: 'SystemMaxUse={{ amazon2cis_journald_systemmaxuse }}'}
    - { regexp: '^#SystemKeepFree=|^SystemKeepFree=', line: 'SystemKeepFree={{ amazon2cis_journald_systemkeepfree }}' }
    - { regexp: '^#RuntimeMaxUse=|^RuntimeMaxUse=', line: 'RuntimeMaxUse={{ amazon2cis_journald_runtimemaxuse }}'}
    - { regexp: '^#RuntimeKeepFree=|^RuntimeKeepFree=', line: 'RuntimeKeepFree={{ amazon2cis_journald_runtimekeepfree }}'}
    - { regexp: '^#MaxFileSec=|^MaxFileSec=', line: 'MaxFileSec={{ amazon2cis_journald_maxfilesec }}'}

- name: "6.1.1.7 | PATCH | Ensure journald log file access is configured"
  when: amazon2cis_rule_6_1_1_7
  tags:
    - level1-server
    - manual
    - patch
    - journald
    - rule_6.1.1.7
    - NIST800-53R5_AC-3
    - NIST800-53R5_AU-2
    - NIST800-53R5_AU-12
    - NIST800-53R5_MP-2
    - NIST800-53R5_SI-5
  block:
    - name: "6.1.1.7 | PATCH | Ensure journald log file access is configured | Default file permissions"
      ansible.builtin.file:
        path: /usr/lib/tmpfiles.d/systemd.conf
        mode: 'u-x,g-wx,o-rwx'

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Check for override file"
      ansible.builtin.stat:
        path: /etc/tmpfiles.d/systemd.conf
      register: discovered_tmpfile_override

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | If override file check for journal"
      when: discovered_tmpfile_override.stat.exists
      ansible.builtin.shell: |
        set -o pipefail
        grep -E 'z /var/log/journal/%m/system.journal \d*' /etc/tmpfiles.d/systemd.conf
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_journald_fileperms_override.rc not in [ 0, 1 ]
      register: discovered_journald_fileperms_override

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Warning if override found"
      when:
        - discovered_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! - tmpfiles override found in /etc/tmpfiles.d/systemd.conf affecting journald files, please confirm it matches site policy"

    - name: "6.1.1.7 | AUDIT | Ensure journald log file access is configured | Capture Warning"
      when:
        - discovered_tmpfile_override.stat.exists
        - discovered_journald_fileperms_override.stdout | length > 0
      vars:
        warn_control_id: '6.1.1.7'
      ansible.builtin.import_tasks:
        file: warning_facts.yml
