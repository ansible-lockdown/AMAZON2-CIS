---

- name: "SECTION | 6.1.1.x | Configure journald"
  when: amazon2cis_syslog == 'journald'
  ansible.builtin.import_tasks:
    file: cis_6.1.1.x.yml

- name: "SECTION | 6.1.2.x | Configure rsyslog"
  when: amazon2cis_syslog == 'rsyslog'
  ansible.builtin.import_tasks:
    file: cis_6.1.2.x.yml

- name: "SECTION | 6.1.3.x | Configure logfile access"
  ansible.builtin.import_tasks:
    file: cis_6.1.3.x.yml

- name: "SECTION | 6.2.1.x | Ensure auditing is enabled"
  ansible.builtin.import_tasks:
    file: cis_6.2.1.x.yml

- name: "SECTION | 6.2.2.x | Configure Data Retention"
  ansible.builtin.import_tasks:
    file: cis_6.2.2.x.yml

- name: "SECTION | 6.2.3.x | Configure auditd rules"
  ansible.builtin.import_tasks:
    file: cis_6.2.3.x.yml

- name: "SECTION | 6.2.4.x | Configure auditd file access"
  ansible.builtin.import_tasks:
    file: cis_6.2.4.x.yml

- name: "SECTION | 6.3.x | Configure Filesystem Integrity Checking"
  when: amazon2cis_config_aide
  ansible.builtin.import_tasks:
    file: cis_6.3.x.yml
