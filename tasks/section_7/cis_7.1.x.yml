- name: "7.1.1 | PATCH | Ensure access to /etc/passwd is configured"
  when: amazon2cis_rule_7_1_1
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - permissions
    - rule_7.1.1
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: 'u-x,go-wx'

