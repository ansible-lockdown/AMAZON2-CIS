- name: "7.1.11 | PATCH | Ensure world writable files and directories are secured"
  when:
    - amazon2cis_rule_7_1_11
    - amazon2cis_disruption_high
  tags:
    - level1-server
    - automated
    - patch
    - files
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - permissions
    - rule_7.1.11
  block:
    - name: "7.1.11 | AUDIT | Ensure world writable files and directories are secured | Get list of world-writable files"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type f -perm -0002
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      failed_when: false
      changed_when: false
      register: discovered_perms_results

    - name: "7.1.11 | PATCH | Ensure world writable files and directories are secured"
      when:
        - discovered_perms_results.stdout_lines is defined
        - amazon2cis_no_world_write_adjust
      ansible.builtin.file:
        path: '{{ item }}'
        mode: 'o-w'
        state: touch
      with_items: "{{ discovered_perms_results.stdout_lines }}"

    - name: "7.1.11 | PATCH | Ensure world writable files and directories are secured | sticky bit set on world-writable directories"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -type d -perm -0002 2>/dev/null | xargs chmod a+t
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: false

    - name: "7.1.11 | AUDIT | Ensure world writable files and directories are secured | Warning"
      when:
        - discovered_perms_results.stdout_lines is defined
        - not amazon2cis_no_world_write_adjust
      ansible.builtin.debug:
        msg: "Warning!! - WorldWritable files have been found"

    - name: "7.1.11 | AUDIT | Ensure world writable files and directories are secured | Warn Count"
      when:
        - discovered_perms_results.stdout_lines is defined
        - not amazon2cis_no_world_write_adjust
      vars:
        warn_control_id: '7.1.11'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "7.1.12 | PATCH | Ensure no files or directories without an owner and a group exist"
  when:
    - amazon2cis_rule_7_1_12
    - amazon2cis_disruption_high
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_AC-3
    - NIST800-53R5_MP-2
    - rule_7.1.12
    - permissions
  block:
    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Get list files or directories"
      ansible.builtin.command: find {{ amazon2cis_exclude_unowned_search_path }} {{ item.mount }} -xdev \( -nouser -o -nogroup \) -not -fstype nfs
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_unowned_files
      with_items:
        - "{{ ansible_facts['mounts'] }}"
      loop_control:
        label: "{{ item.mount }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Flatten no_user_items results for easier use"
      ansible.builtin.set_fact:
        discovered_unowned_files_flatten: "{{ discovered_unowned_files.results | selectattr('stdout_lines', 'defined') | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Alert on unowned files and directories"
      when:
        - not amazon2cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      ansible.builtin.debug:
        msg:
          - "Warning!! You have unowned files and are configured to not auto-remediate for this task"
          - "Please review the files/directories below and assign an owner"
          - "{{ discovered_unowned_files_flatten }}"

    - name: "7.1.12 | PATCH | Ensure no files or directories without an owner and a group exist | Set files/directories to configured owner and group"
      when:
        - amazon2cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ amazon2cis_unowned_owner }}"
        group: "{{ amazon2cis_ungrouped_group }}"
      with_items:
        - "{{ discovered_unowned_files_flatten }}"

    - name: "7.1.12 | AUDIT | Ensure no files or directories without an owner and a group exist | Warn Count"
      when:
        - not amazon2cis_ownership_adjust
        - discovered_unowned_files_flatten | length > 0
      vars:
        warn_control_id: '7.1.12'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed"
  when:
    - amazon2cis_rule_7_1_13
    - amazon2cis_disruption_high
  tags:
    - level1-server
    - manual
    - audit
    - rule_7.1.13
    - permissions
  block:
    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Find SUID executables"
      ansible.builtin.command: find {{ item }} -xdev -type f -perm -4000 -not -fstype nfs
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_suid_executables
      loop: "{{ prelim_mount_names }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Find all SGID executables"
      ansible.builtin.command: find {{ item }} -xdev -type f -perm -2000 -not -fstype nfs
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_sgid_executables
      loop: "{{ prelim_mount_names }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Flatten suid_executables results for easier use"
      ansible.builtin.set_fact:
        discovered_suid_executables_flatten: "{{ discovered_suid_executables.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.13 | AUDIT | Ensure SUID and SGID files are reviewed | Set fact SGID executables"
      ansible.builtin.set_fact:
        discovered_sgid_executables_flatten: "{{ discovered_sgid_executables.results | map(attribute='stdout_lines') | flatten }}"

    - name: "7.1.13 | PATCH | Ensure SUID and SGID files are reviewed | Remove SUID bit"
      when:
        - amazon2cis_suid_adjust
        - discovered_suid_executables_flatten | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'u-s'
      loop: "{{ discovered_suid_executables_flatten }}"

    - name: "7.1.13 | PATCH | Ensure SUID and SGID files are reviewed | Remove SGID bit"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: 'g-s'
      loop: "{{ discovered_sgid_executables_flatten }}"
      when:
        - amazon2cis_sgid_adjust
        - discovered_sgid_executables_flatten | length > 0

    - name: "7.1.13 | WARN | Ensure SUID and SGID files are reviewed |  Alert SGID executables exist"
      when:
        - discovered_sgid_executables_flatten | length > 0
        - not amazon2cis_sgid_adjust
      ansible.builtin.debug:
        msg:
          - "Warning!! You have SGID executables"
          - "The files are listed below, please review the integrity of these binaries"
          - "{{ discovered_sgid_executables_flatten }}"

    - name: "7.1.13 | WARN | Ensure SUID and SGID files are reviewed | Warn Count"
      when: (discovered_suid_executables_flatten | length > 0 and not amazon2cis_suid_adjust) or
          (discovered_sgid_executables_flatten | length > 0 and not amazon2cis_sgid_adjust)
      vars:
        warn_control_id: '7.1.13'
      ansible.builtin.import_tasks:
        file: warning_facts.yml
