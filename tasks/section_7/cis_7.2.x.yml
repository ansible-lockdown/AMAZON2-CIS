- name: "7.2.7 | AUDIT | Ensure no duplicate group names exist"
  when: amazon2cis_rule_7_2_7
  tags:
    - level1-server
    - automated
    - audit
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_7.2.7
    - groups
  block:
    - name: "7.2.7 | AUDIT | Ensure no duplicate group names exist | Check for duplicate group names"
      ansible.builtin.shell: |
        set -o pipefail
        getent passwd | cut -d: -f1 | sort -n | uniq -d
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: false
      check_mode: false
      register: discovered_group_check

    - name: "7.2.7 | AUDIT | Ensure no duplicate group names exist | Print warning about users with duplicate group names"
      when: discovered_group_check.stdout | length > 0
      ansible.builtin.debug:
        msg: "Warning!! The following group names are duplicates: {{ discovered_group_check.stdout_lines }}"

    - name: "7.2.7 | AUDIT | Ensure no duplicate group names exist | Set warning count"
      when: discovered_group_check.stdout | length > 0
      vars:
        warn_control_id: '7.2.7'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "7.2.8 | PATCH | Ensure local interactive user home directories are configured"
  when: amazon2cis_rule_7_2_8
  tags:
    - level1-server
    - patch
    - users
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_7.2.8
  block:
    - name: "7.2.8 | PATCH | Ensure local interactive user home directories are configured | Create dir if absent"  # noqa risky-file-permissions
      ansible.builtin.file:
        path: "{{ item.dir }}"
        state: directory
        owner: "{{ item.id }}"
        group: "{{ item.gid }}"
      register: discovered_home_dir
      loop: "{{ prelim_captured_passwd_data | selectattr('uid', '>=', amazon2cis_uid_min | int) | selectattr('uid', '<=', amazon2cis_uid_max | int) | list }}"
      loop_control:
        label: "{{ item.id }}"

    - name: "7.2.8 | AUDIT | Ensure local interactive user home directories are configured | get perms stat"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: discovered_home_dir_perms
      loop: "{{ prelim_interactive_users_home.stdout_lines }}"

    - name: "7.2.8 | PATCH | Ensure local interactive user home directories are configured | set perms if needed"
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: directory
        mode: 'g-w,o-rwx'
      loop: "{{ discovered_home_dir_perms.results }}"
      loop_control:
        label: "{{ item }}"

    # set default ACLs so the homedir has an effective umask of 0027
    - name: "7.2.8 | PATCH | Ensure local interactive user home directories are configured | Set group ACL"
      ansible.posix.acl:
        path: "{{ item }}"
        default: true
        etype: group
        permissions: rx
        state: present
      loop: "{{ prelim_interactive_users_home.stdout_lines }}"

    - name: "7.2.8 | PATCH | Ensure local interactive user home directories are configured | Set other ACL"
      ansible.posix.acl:
        path: "{{ item }}"
        default: true
        etype: other
        permissions: 0
        state: present
      loop: "{{ prelim_interactive_users_home.stdout_lines }}"

- name: "7.2.9 | PATCH | Ensure local interactive user dot files access is configured"
  when:
    - amazon2cis_rule_7_2_9
    - amazon2cis_disruption_high
  tags:
    - level1-server
    - automated
    - patch
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_IA-5
    - rule_7.2.9
    - user
  block:
    - name: "7.2.9 | AUDIT | Ensure local interactive user dot files access is configured | Check for files"
      ansible.builtin.shell: |
        set -o pipefail
        find /home/ -name "\.*" -perm /g+w,o+w
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_dot_files_audit.rc not in [ 0, 1 ]
      check_mode: false
      register: discovered_dot_files_audit

    - name: "7.2.9 | AUDIT | Ensure local interactive user dot files access is configured | Warning on files found"
      when:
        - discovered_dot_files_audit.stdout | length > 0
        - amazon2cis_dotperm_ansiblemanaged
      ansible.builtin.debug:
        msg:
          - "Warning!! You have group or world-writable dot files on your system and have configured for manual intervention"

    - name: "7.2.9 | PATCH | Ensure local interactive user dot files access is configured | Set warning count"
      when:
        - discovered_dot_files_audit.stdout | length > 0
        - amazon2cis_dotperm_ansiblemanaged
      vars:
        warn_control_id: '7.2.9'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

    - name: "7.2.9 | PATCH | Ensure local interactive user dot files access is configured | Changes files if configured"
      when:
        - discovered_dot_files_audit.stdout | length > 0
        - amazon2cis_dotperm_ansiblemanaged
      ansible.builtin.file:
        path: "{{ item }}"
        mode: go-w
      loop: "{{ discovered_dot_files_audit.stdout_lines }}"
