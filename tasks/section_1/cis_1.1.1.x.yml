- name: "1.1.1.7 | AUDIT | Ensure unused filesystems kernel modules are not available"
  when: amazon2cis_rule_1_1_1_7
  tags:
    - level1-server
    - manual
    - audit
    - rule_1.1.1.7
    - modprobe
  vars:
    warn_control_id: '1.1.1.7'
  block:
    - name: "1.1.1.7 | AUDIT | Ensure unused filesystems kernel modules are not available | Discover loaded filesystem modules"
      ansible.builtin.shell: |
        set -o pipefail
        lsmod | awk 'NR>1 {print $1}' | sort -u
      args:
        executable: "{{ amazon2cis_shell_executable }}"
      changed_when: false
      failed_when: discovered_loaded_kernel_modules.rc not in [ 0, 1 ]
      register: discovered_loaded_kernel_modules

    - name: "1.1.1.7 | AUDIT | Ensure unused filesystems kernel modules are not available | Identify unused filesystem modules"
      ansible.builtin.set_fact:
        discovered_unused_fs_modules: "{{ discovered_loaded_kernel_modules.stdout_lines | intersect(amazon2cis_unused_filesystem_modules) }}"

    - name: "1.1.1.7 | AUDIT | Ensure unused filesystems kernel modules are not available | Output Warning"
      when: discovered_unused_fs_modules | length > 0
      ansible.builtin.debug:
        msg: "{{ ['Warning!! The following unused filesystem kernel modules are loaded and need review. Unloading a filesystem in use may be FATAL, this is a manual task'] + discovered_unused_fs_modules }}"

    - name: "1.1.1.7 | AUDIT | Ensure unused filesystems kernel modules are not available | Capture Warning"
      when: discovered_unused_fs_modules | length > 0
      ansible.builtin.import_tasks:
        file: warning_facts.yml
