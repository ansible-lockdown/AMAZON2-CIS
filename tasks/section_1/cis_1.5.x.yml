---

- name: "1.5.1 | PATCH | Ensure core file size is configured"
  when: amazon2cis_rule_1_5_1
  tags:
    - level1-server
    - automated
    - patch
    - rule_1.5.1
    - limits
    - NIST800-53R5_CM-6
  block:
    - name: "1.5.1 | AUDIT | Ensure core file size is configured | Discover limits.d files with a hard core limit"
      ansible.builtin.find:
        paths: /etc/security/limits.d
        contains: '^\s*[^#\n\r]+\s+hard\s+core\s+([1-9][0-9]*)'
      register: discovered_security_limits_files

    - name: "1.5.1 | PATCH | Ensure core file size is configured | Comment out hard core limits in limits.conf"
      ansible.builtin.replace:
        path: /etc/security/limits.conf
        regexp: '^(\s*[^#\n\r]+\s+hard\s+core\s+[1-9][0-9]*.*)$'
        replace: '# \1'

    - name: "1.5.1 | PATCH | Ensure core file size is configured | Comment out hard core limits in limits.d"
      when:
        - discovered_security_limits_files.files is defined
        - item.path != '/etc/security/limits.d/60-limits.conf'
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '^(\s*[^#\n\r]+\s+hard\s+core\s+[1-9][0-9]*.*)$'
        replace: '# \1'
      loop: "{{ discovered_security_limits_files.files }}"

    - name: "1.5.1 | PATCH | Ensure core file size is configured | Set hard core limit"
      ansible.builtin.lineinfile:
        path: /etc/security/limits.d/60-limits.conf
        regexp: '^\s*\*\s+hard\s+core'
        line: "* hard core 0"
        create: true
        owner: root
        group: root
        mode: 'u-x,go-wx'

- name: "1.5.2 | PATCH | Ensure fs.protected_hardlinks is configured"
  when: amazon2cis_rule_1_5_2
  tags:
    - level1-server
    - automated
    - patch
    - sysctl
    - rule_1.5.2
    - NIST800-53R5_AC-3
    - NIST800-53R5_AC-6
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: '1'
    state: present
    reload: true
    sysctl_set: true
    ignoreerrors: true
    sysctl_file: "{{ amazon2cis_fs_sysctl_file }}"

